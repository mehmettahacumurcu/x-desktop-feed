[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "x-desktop-feed"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "beautifulsoup4>=4.12,<5",
  "jinja2>=3.1,<4",
  "joblib>=1.4,<2",
  "platformdirs>=4.3,<5",
  "scikit-learn>=1.5,<2",
  "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.9,<1",
]

[project.scripts]
xfeed = "xfeed.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xfeed"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["xfeed"]
